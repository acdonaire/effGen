name: Cerebras Quick Check

# Lightweight push-time verification that CerebrasAdapter still talks to the
# real API. Runs gpt-oss-120b only (free-tier callable, low queue pressure);
# the older llama3.1-8b / qwen-3-235b ids were deprecated upstream (404
# model_not_found as of 2026-05-27). gpt-oss-120b is a reasoning model, so the
# plain-generate step uses a larger max_tokens budget (reasoning tokens would
# otherwise consume an 8-token cap and leave the visible content empty).

on:
  push:
    branches: [main, develop]
    paths:
      - "effgen/models/cerebras_adapter.py"
      - "effgen/models/cerebras_models.py"
      - "effgen/models/_rate_limit.py"
      - "effgen/models/_cost.py"
      - "effgen/core/agent.py"
      - "effgen/tools/builtin/calculator.py"
      - "pyproject.toml"
      - ".github/workflows/cerebras-quick.yml"
  pull_request:
    branches: [main]
    paths:
      - "effgen/models/cerebras_adapter.py"
      - "effgen/models/cerebras_models.py"
      - "effgen/models/_rate_limit.py"
      - "effgen/models/_cost.py"
      - "effgen/core/agent.py"
      - "effgen/tools/builtin/calculator.py"
      - "pyproject.toml"
      - ".github/workflows/cerebras-quick.yml"
  workflow_dispatch:

concurrency:
  group: cerebras-quick-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  cerebras-quick-check:
    name: Cerebras Quick Check (gpt-oss-120b)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cerebras-quick-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-cerebras-quick-

      - name: Install effgen with cerebras extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cerebras]" -q

      - name: Debug secret presence (no value leak)
        env:
          K: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "$K" ]; then
            echo "MISSING: secrets.CEREBRAS_API_KEY is empty in this job."
            echo "  - Is the secret named exactly CEREBRAS_API_KEY (case-sensitive)?"
            echo "  - Is it a repository secret (Settings > Secrets and variables > Actions)?"
            echo "  - Is this a pull_request from a fork? Forks don't get secrets."
            exit 1
          fi
          # GitHub auto-redacts the value in logs; only safe metadata is printed.
          echo "PRESENT, length=${#K}, first4=${K:0:4}"

      - name: Generation + streaming + tool-calling smoke (gpt-oss-120b)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MODEL: "gpt-oss-120b"
        run: |
          python - <<'PY'
          import os, random, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          model_id = os.environ["MODEL"]

          if not api_key:
              print(f"SKIPPED: CEREBRAS_API_KEY not set for {model_id}")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.models.base import GenerationConfig
          from effgen.core.agent import Agent, AgentConfig
          from effgen.tools.builtin.calculator import Calculator

          # ----- backoff helper ---------------------------------------
          # 5 attempts with exponential backoff + jitter:
          #   ~3s, ~6s, ~12s, ~24s, ~48s   (worst-case ≈ 90s wall-time)
          # Cerebras's "queue_exceeded" 429 typically clears within 30-60s.
          MAX_ATTEMPTS = 5
          BASE_DELAY = 3.0
          MAX_DELAY = 60.0

          def is_retriable(exc: Exception) -> bool:
              s = str(exc).lower()
              return any(tag in s for tag in (
                  "429", "rate", "queue_exceeded",
                  "too_many_requests", "high traffic",
                  "timeout", "service unavailable", "503",
              ))

          def backoff(attempt: int) -> float:
              # exponential with full jitter
              cap = min(MAX_DELAY, BASE_DELAY * (2 ** attempt))
              return random.uniform(0.5, cap)

          def with_retry(label: str, fn):
              last_exc = None
              for attempt in range(MAX_ATTEMPTS):
                  try:
                      return fn()
                  except Exception as exc:
                      last_exc = exc
                      retriable = is_retriable(exc)
                      tag = "RETRIABLE" if retriable else "FATAL"
                      print(f"WARN[{label}] attempt {attempt+1}/{MAX_ATTEMPTS} {tag}: {exc}")
                      if not retriable or attempt == MAX_ATTEMPTS - 1:
                          break
                      delay = backoff(attempt)
                      print(f"     sleeping {delay:.1f}s before retry…")
                      time.sleep(delay)
              raise RuntimeError(f"{label} failed after {MAX_ATTEMPTS} attempts: {last_exc}")

          # ----- adapter --------------------------------------------------
          adapter = CerebrasAdapter(model_id, enable_rate_limiting=False)
          adapter.load()

          # ----- 1. Plain generate ----------------------------------------
          def _gen():
              return adapter.generate(
                  "Reply with a single word: ALIVE",
                  config=GenerationConfig(temperature=0.0, max_tokens=512),
              )

          # gpt-oss-120b is a reasoning model: the reasoning pass alone spends
          # ~70+ completion tokens before any visible content, so a small
          # max_tokens cap finishes with finish_reason="length" and empty
          # content. Budget enough room for the reasoning pass plus the answer.
          out = with_retry("generate", _gen)
          if not (out.text or "").strip():
              print(f"FAIL[{model_id}]: generate returned empty text")
              sys.exit(1)
          print(f"OK[{model_id}]: generate -> {out.text!r}")

          # ----- 2. Streaming ---------------------------------------------
          def _stream():
              chunks = list(adapter.generate_stream("Count: 1, 2, 3."))
              text = "".join(chunks)
              if not text:
                  raise RuntimeError("stream returned empty text")
              return chunks, text

          chunks, text = with_retry("stream", _stream)
          print(f"OK[{model_id}]: stream -> {len(chunks)} chunks, {len(text)} chars")

          # ----- 3. Tool-calling agent (12*12=144) ------------------------
          def _tools():
              cfg = AgentConfig(
                  name=f"quick-{model_id}",
                  model=adapter,
                  tools=[Calculator()],
                  system_prompt="Use the calculator tool. Answer concisely.",
                  max_iterations=5,
                  temperature=0.1,
              )
              resp = Agent(cfg).run("What is 12 * 12?")
              text = str(resp.output or "")
              if "144" not in text:
                  # treat empty/wrong output the same as a transient miss; let
                  # with_retry decide whether to retry (only if it looks 429-ish).
                  raise RuntimeError(f"'144' missing from output: {text!r}")
              return text

          try:
              tools_out = with_retry("tools", _tools)
              print(f"OK[{model_id}]: tool-calling -> '144' present")
          except Exception as exc:
              print(f"FAIL[{model_id}]: {exc}")
              adapter.unload()
              sys.exit(1)

          adapter.unload()
          print(f"All Cerebras quick checks passed for {model_id}")
          PY
