name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

# Opt into Node.js 24 for all actions (Node 20 is deprecated Sep 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify critical imports
        run: |
          python -c "
          import effgen; print(f'effgen {effgen.__version__}')
          from effgen.guardrails import GuardrailChain
          from effgen.rag import DocumentIngester
          from effgen.eval import AgentEvaluator
          from effgen.domains import TechDomain
          from effgen.cache import PromptCache
          print('All imports OK')
          "

      - name: Run all unit tests
        run: |
          pytest tests/unit/ -v --cov=effgen --cov-report=xml \
            --tb=short --no-header

      - name: Run integration tests (non-GPU)
        run: |
          pytest tests/integration/ -v -m "not gpu and not docker" \
            --tb=short --no-header || true

      - name: Run e2e tests (non-GPU)
        run: |
          pytest tests/e2e/ -v -m "not gpu" \
            --tb=short --no-header || true

      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ -v --tb=short --no-header || true

  eval-regression:
    name: Eval Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,groq]"

      - name: Run eval suite with Groq openai/gpt-oss-20b
        id: eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, traceback
          from pathlib import Path

          api_key = os.getenv("GROQ_API_KEY", "")
          if not api_key:
              Path("regression-report.md").write_text(
                  "SKIPPED: GROQ_API_KEY secret not set — add it in GitHub Settings > Secrets."
              )
              Path("eval-status.txt").write_text("skipped")
              print("SKIPPED: GROQ_API_KEY secret not set.")
              sys.exit(0)

          status = "crashed"
          report_md = "Eval did not complete — see workflow logs."
          try:
              from effgen.eval import AgentEvaluator, MathSuite, RegressionTracker
              from effgen.eval.evaluator import ScoringMode
              from effgen.models.groq_adapter import GroqAdapter
              from effgen.core.agent import Agent, AgentConfig
              from effgen.tools.builtin.calculator import Calculator

              # Migrated off Cerebras free tier (issues #41 / #42): the
              # llama3.1-8b RPM cap was tightened upstream and the eval
              # collapsed to ~0.4 accuracy with empty 429 responses.
              # Groq's openai/gpt-oss-20b reliably scores ≥0.85 with sub-second
              # latency on the free tier.
              adapter = GroqAdapter("openai/gpt-oss-20b")
              adapter.load()
              config = AgentConfig(
                  name="nightly-eval",
                  model=adapter,
                  tools=[Calculator()],
                  system_prompt="You are a math assistant. Use the calculator tool for each computation. Give a concise final numerical answer.",
                  max_iterations=5,
                  temperature=0.1,
              )
              agent = Agent(config)

              ev = AgentEvaluator(agent, scoring=ScoringMode.CONTAINS)
              results = ev.run_suite(MathSuite(), max_cases=20)
              tracker = RegressionTracker()
              report = tracker.compare("math-20", results, version="ci-nightly")
              report_md = report.to_markdown()
              print(report_md)
              Path("regression-report.md").write_text(report_md)
              Path("eval-summary.json").write_text(json.dumps(results.summary(), indent=2))
              if report.has_regressions:
                  status = "regression"
                  Path("eval-status.txt").write_text("regression")
                  raise SystemExit("Regression detected — see report above")
              status = "passed"
              Path("eval-status.txt").write_text("passed")
          except SystemExit:
              raise
          except Exception:
              tb = traceback.format_exc()
              report_md = f"## Eval crashed\n\n```\n{tb}\n```\n"
              Path("regression-report.md").write_text(report_md)
              Path("eval-status.txt").write_text("crashed")
              print(report_md)
              sys.exit(1)
          PY

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            regression-report.md
            eval-summary.json
            eval-status.txt

      - name: Open issue on regression or crash
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = fs.existsSync('eval-status.txt')
              ? fs.readFileSync('eval-status.txt', 'utf8').trim()
              : 'crashed';
            const body = fs.existsSync('regression-report.md')
              ? fs.readFileSync('regression-report.md', 'utf8')
              : 'Eval failed but no report file produced.';
            // Distinguish a real metric regression from an infrastructure
            // crash (rate-limit, network, auth, etc.). The latter should not
            // be filed as a "regression" — it is a test infra failure.
            const date = new Date().toISOString().slice(0,10);
            let title, labels;
            if (status === 'regression') {
              title = `Nightly eval regression detected (${date})`;
              labels = ['regression', 'automated'];
            } else {
              title = `Nightly eval test failed: infrastructure error (${date})`;
              labels = ['ci-failure', 'automated'];
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
            } catch (e) {
              core.warning(`Could not open issue (likely permissions): ${e.message}`);
            }

  # ------------------------------------------------------------------ #
  # Real-model streaming smoke test (Cerebras gpt-oss-120b)            #
  # ------------------------------------------------------------------ #
  cerebras-streaming-smoke:
    name: Cerebras Streaming Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [all] alone exceeds pip's resolver depth; the lock collapses the search.
          pip install -e ".[all]" -c requirements-all-lock.txt
      - name: Streaming smoke test
        id: stream
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, random, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.models._cost import CostTracker

          # Exponential-backoff retry around Cerebras free-tier 429s.
          MAX_ATTEMPTS, BASE_DELAY, MAX_DELAY = 5, 3.0, 60.0

          def is_retriable(exc):
              s = str(exc).lower()
              return any(t in s for t in (
                  "429", "rate", "queue_exceeded",
                  "too_many_requests", "high traffic",
                  "timeout", "503", "service unavailable",
              ))

          def backoff(a):
              return random.uniform(0.5, min(MAX_DELAY, BASE_DELAY * (2 ** a)))

          def stream_once(model_id):
              adapter = CerebrasAdapter(model_id, enable_rate_limiting=False)
              adapter.load()
              try:
                  chunks = list(adapter.generate_stream("Say hello in one sentence."))
                  text = "".join(chunks)
              finally:
                  adapter.unload()
              if not text:
                  raise RuntimeError("empty stream text")
              return chunks, text

          # gpt-oss-120b only: the older llama3.1-8b / qwen-3-235b ids were
          # deprecated upstream (404 model_not_found as of 2026-05-27).
          model_id = "gpt-oss-120b"
          last = None
          for attempt in range(MAX_ATTEMPTS):
              try:
                  chunks, text = stream_once(model_id)
                  print(f"OK: {model_id} -> {len(chunks)} chunks, {len(text)} chars")
                  break
              except Exception as exc:
                  last = exc
                  retriable = is_retriable(exc)
                  print(f"WARN[{model_id}] attempt {attempt+1}/{MAX_ATTEMPTS} "
                        f"{'RETRIABLE' if retriable else 'FATAL'}: {exc}")
                  if not retriable or attempt == MAX_ATTEMPTS - 1:
                      print(f"FAIL: {model_id} streaming after {attempt+1} attempts: {exc}")
                      sys.exit(1)
                  d = backoff(attempt)
                  print(f"     sleeping {d:.1f}s before retry…")
                  time.sleep(d)

          for row in CostTracker.get().summary():
              print(f"  {row['provider']}/{row['model']}: prompt={row['prompt_tokens']} cost=${row['cost_usd']:.6f}")
          PY
      - name: Open issue on streaming failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras streaming smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly streaming smoke test failed for Cerebras gpt-oss-120b after 5 retries with exponential backoff. Check workflow logs — likely an effGen regression rather than a transient queue 429.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model tool-calling smoke test (Cerebras gpt-oss-120b)         #
  # ------------------------------------------------------------------ #
  cerebras-tools-smoke:
    name: Cerebras Tools Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [all] alone exceeds pip's resolver depth; the lock collapses the search.
          pip install -e ".[all]" -c requirements-all-lock.txt
      - name: Tool-calling smoke test
        id: tools
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, random, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.core.agent import Agent, AgentConfig
          from effgen.tools.builtin.calculator import Calculator

          MAX_ATTEMPTS, BASE_DELAY, MAX_DELAY = 5, 3.0, 60.0

          def is_retriable(exc_or_text):
              s = str(exc_or_text).lower()
              return any(t in s for t in (
                  "429", "rate", "queue_exceeded",
                  "too_many_requests", "high traffic",
                  "maximum iterations", "empty response",
                  "timeout", "503", "service unavailable",
              ))

          def backoff(a):
              return random.uniform(0.5, min(MAX_DELAY, BASE_DELAY * (2 ** a)))

          # gpt-oss-120b only: llama3.1-8b / qwen-3-235b were deprecated upstream
          # (404 model_not_found as of 2026-05-27).
          last_output = ""
          last_exc = None
          for attempt in range(MAX_ATTEMPTS):
              adapter = CerebrasAdapter("gpt-oss-120b", enable_rate_limiting=False)
              adapter.load()
              config = AgentConfig(
                  name="tools-smoke",
                  model=adapter,
                  tools=[Calculator()],
                  system_prompt="You are a math assistant. Use the calculator tool.",
                  max_iterations=5,
                  temperature=0.1,
              )
              try:
                  resp = Agent(config).run("What is 12 * 12?")
                  last_output = str(resp.output or "")
                  print(f"[attempt {attempt+1}] Output: {last_output!r}")
                  print(f"[attempt {attempt+1}] Tool calls: {getattr(resp, 'tool_calls', 0) or 0}")
                  if "144" in last_output:
                      adapter.unload()
                      print("OK: tool-calling smoke passed (12*12=144)")
                      sys.exit(0)
                  last_exc = RuntimeError(f"'144' missing from output: {last_output!r}")
              except Exception as exc:
                  last_exc = exc
                  last_output = ""
                  print(f"WARN[tools] attempt {attempt+1}/{MAX_ATTEMPTS} raised: {exc}")
              finally:
                  adapter.unload()

              if attempt < MAX_ATTEMPTS - 1 and is_retriable(last_exc or last_output):
                  d = backoff(attempt)
                  print(f"     sleeping {d:.1f}s before retry…")
                  time.sleep(d)
              else:
                  break

          print(f"FAIL: answer 144 not in output after {attempt+1} attempts. Last: {last_output!r}")
          sys.exit(1)
          PY
      - name: Open issue on tool-calling failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras tool-calling smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly tool-calling smoke test failed for Cerebras gpt-oss-120b. Calculator+Agent did not return 144 for 12*12. Check workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model reasoning test (multi-step, two models)                 #
  # ------------------------------------------------------------------ #
  cerebras-reasoning-smoke:
    name: Cerebras Reasoning Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [all] alone exceeds pip's resolver depth; the lock collapses the search.
          pip install -e ".[all]" -c requirements-all-lock.txt
      - name: Reasoning smoke test
        id: reason
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, random, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.models.base import GenerationConfig

          # Affirmative tokens that signal the model agreed roses need water.
          AFFIRM = ("yes", "they do", "they need", "do need", "need water")

          MAX_ATTEMPTS, BASE_DELAY, MAX_DELAY = 5, 3.0, 60.0

          def is_correct(text: str) -> bool:
              return any(t in text.lower() for t in AFFIRM)

          def is_retriable(exc):
              s = str(exc).lower()
              return any(t in s for t in (
                  "429", "rate", "queue_exceeded",
                  "too_many_requests", "high traffic",
                  "timeout", "503", "service unavailable",
              ))

          def backoff(a):
              return random.uniform(0.5, min(MAX_DELAY, BASE_DELAY * (2 ** a)))

          # gpt-oss-120b only: llama3.1-8b / qwen-3-235b were deprecated upstream
          # (404 model_not_found as of 2026-05-27).
          model_id = "gpt-oss-120b"
          adapter = CerebrasAdapter(model_id, enable_rate_limiting=False)
          adapter.load()

          best_text = ""
          correct = False
          last_exc = None
          for attempt in range(MAX_ATTEMPTS):
              try:
                  result = adapter.generate(
                      "If all roses are flowers and all flowers need water, "
                      "do roses need water? Answer with just 'yes' or 'no' first, "
                      "then a one-sentence explanation.",
                      # gpt-oss-120b is a reasoning model: a tiny max_tokens cap is
                      # spent on reasoning tokens and leaves the visible answer
                      # empty, so give it room for the final content.
                      config=GenerationConfig(temperature=0.0, max_tokens=512),
                  )
                  best_text = (result.text or "").strip()
                  if is_correct(best_text):
                      correct = True
                      break
                  # Wrong content is not retriable — different problem entirely.
                  last_exc = RuntimeError(f"unexpected text: {best_text!r}")
                  break
              except Exception as exc:
                  last_exc = exc
                  retriable = is_retriable(exc)
                  print(f"WARN[{model_id}] attempt {attempt+1}/{MAX_ATTEMPTS} "
                        f"{'RETRIABLE' if retriable else 'FATAL'}: {exc}")
                  if not retriable or attempt == MAX_ATTEMPTS - 1:
                      break
                  d = backoff(attempt)
                  print(f"     sleeping {d:.1f}s before retry…")
                  time.sleep(d)
          adapter.unload()

          print(f"{'OK' if correct else 'FAIL'}: {model_id} -> {best_text!r}")
          if not correct:
              print(f"FAIL: reasoning check did not pass. Last error: {last_exc}")
              sys.exit(1)
          PY
      - name: Open issue on reasoning failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras reasoning smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly reasoning smoke: gpt-oss-120b failed a basic yes/no logic question after 5 retries with exponential backoff. This indicates either a Cerebras model regression or an effGen prompt/parsing regression — not a transient queue 429.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # gpu-tests (self-hosted GPU runner, optional)                        #
