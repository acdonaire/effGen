name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

# Opt into Node.js 24 for all actions (Node 20 is deprecated Sep 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify critical imports
        run: |
          python -c "
          import effgen; print(f'effgen {effgen.__version__}')
          from effgen.guardrails import GuardrailChain
          from effgen.rag import DocumentIngester
          from effgen.eval import AgentEvaluator
          from effgen.domains import TechDomain
          from effgen.cache import PromptCache
          print('All imports OK')
          "

      - name: Run all unit tests
        run: |
          pytest tests/unit/ -v --cov=effgen --cov-report=xml \
            --tb=short --no-header

      - name: Run integration tests (non-GPU)
        run: |
          pytest tests/integration/ -v -m "not gpu and not docker" \
            --tb=short --no-header || true

      - name: Run e2e tests (non-GPU)
        run: |
          pytest tests/e2e/ -v -m "not gpu" \
            --tb=short --no-header || true

      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ -v --tb=short --no-header || true

  eval-regression:
    name: Eval Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cerebras]"

      - name: Run eval suite with real Cerebras llama3.1-8b
        id: eval
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, traceback
          from pathlib import Path

          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              Path("regression-report.md").write_text(
                  "SKIPPED: CEREBRAS_API_KEY secret not set — add it in GitHub Settings > Secrets."
              )
              print("SKIPPED: CEREBRAS_API_KEY secret not set.")
              sys.exit(0)

          # Always write a report — even on crash — so the issue body is useful.
          report_md = "Eval did not complete — see workflow logs."
          try:
              from effgen.eval import AgentEvaluator, MathSuite, RegressionTracker
              from effgen.eval.evaluator import ScoringMode
              from effgen.models.cerebras_adapter import CerebrasAdapter
              from effgen.core.agent import Agent, AgentConfig
              from effgen.tools.builtin.calculator import Calculator

              adapter = CerebrasAdapter("llama3.1-8b", enable_rate_limiting=False)
              adapter.load()
              config = AgentConfig(
                  name="nightly-eval",
                  model=adapter,
                  tools=[Calculator()],
                  system_prompt="You are a math assistant. Use the calculator tool for each computation. Give a concise final numerical answer.",
                  max_iterations=5,
                  temperature=0.1,
              )
              agent = Agent(config)

              ev = AgentEvaluator(agent, scoring=ScoringMode.CONTAINS)
              results = ev.run_suite(MathSuite(), max_cases=20)
              tracker = RegressionTracker()
              report = tracker.compare("math-20", results, version="ci-nightly")
              report_md = report.to_markdown()
              print(report_md)
              Path("regression-report.md").write_text(report_md)
              if report.has_regressions:
                  raise SystemExit("Regression detected — see report above")
          except SystemExit:
              raise
          except Exception:
              tb = traceback.format_exc()
              report_md = f"## Eval crashed\n\n```\n{tb}\n```\n"
              Path("regression-report.md").write_text(report_md)
              print(report_md)
              sys.exit(1)
          PY

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression-report.md

      - name: Open issue on regression
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('regression-report.md')
              ? fs.readFileSync('regression-report.md', 'utf8')
              : 'Regression detected but no report file produced.';
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly eval regression detected (${new Date().toISOString().slice(0,10)})`,
                body,
                labels: ['regression', 'automated'],
              });
            } catch (e) {
              core.warning(`Could not open issue (likely permissions): ${e.message}`);
            }

  # ------------------------------------------------------------------ #
  # Real-model streaming smoke test (Cerebras llama3.1-8b)            #
  # ------------------------------------------------------------------ #
  cerebras-streaming-smoke:
    name: Cerebras Streaming Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Streaming smoke test
        id: stream
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.models._cost import CostTracker

          for model_id in ["llama3.1-8b", "qwen-3-235b-a22b-instruct-2507"]:
              adapter = CerebrasAdapter(model_id, enable_rate_limiting=False)
              adapter.load()
              chunks = list(adapter.generate_stream("Say hello in one sentence."))
              adapter.unload()
              text = "".join(chunks)
              if not text:
                  print(f"FAIL: {model_id} streaming returned empty text")
                  sys.exit(1)
              print(f"OK: {model_id} -> {len(chunks)} chunks, {len(text)} chars")

          print("All streaming checks passed")
          for row in CostTracker.get().summary():
              print(f"  {row['provider']}/{row['model']}: prompt={row['prompt_tokens']} cost=${row['cost_usd']:.6f}")
          PY
      - name: Open issue on streaming failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras streaming smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly streaming smoke test failed for Cerebras llama3.1-8b or qwen-3-235b. Check workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model tool-calling smoke test (Cerebras llama3.1-8b)          #
  # ------------------------------------------------------------------ #
  cerebras-tools-smoke:
    name: Cerebras Tools Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Tool-calling smoke test
        id: tools
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.core.agent import Agent, AgentConfig
          from effgen.tools.builtin.calculator import Calculator

          # Up to 2 attempts; nightly runs occasionally hit Cerebras 429/queue.
          last_output = ""
          last_tool_calls = 0
          for attempt in range(2):
              adapter = CerebrasAdapter("llama3.1-8b", enable_rate_limiting=False)
              adapter.load()
              config = AgentConfig(
                  name="tools-smoke",
                  model=adapter,
                  tools=[Calculator()],
                  system_prompt="You are a math assistant. Use the calculator tool.",
                  max_iterations=5,
                  temperature=0.1,
              )
              agent = Agent(config)
              try:
                  response = agent.run("What is 12 * 12?")
                  last_output = str(response.output or "")
                  last_tool_calls = getattr(response, "tool_calls", 0) or 0
              except Exception as exc:
                  print(f"WARN: attempt {attempt+1} raised: {exc}")
                  last_output = ""
              finally:
                  adapter.unload()

              print(f"[attempt {attempt+1}] Output: {last_output!r}")
              print(f"[attempt {attempt+1}] Tool calls: {last_tool_calls}")
              if "144" in last_output:
                  print("OK: tool-calling smoke passed (12*12=144)")
                  sys.exit(0)
              time.sleep(3)

          print("FAIL: answer 144 not in output after 2 attempts")
          sys.exit(1)
          PY
      - name: Open issue on tool-calling failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras tool-calling smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly tool-calling smoke test failed. Calculator+Agent did not return 144 for 12*12. Check workflow logs.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # Real-model reasoning test (multi-step, two models)                 #
  # ------------------------------------------------------------------ #
  cerebras-reasoning-smoke:
    name: Cerebras Reasoning Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Reasoning smoke test
        id: reason
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, time
          api_key = os.getenv("CEREBRAS_API_KEY", "")
          if not api_key:
              print("SKIPPED: CEREBRAS_API_KEY not set")
              sys.exit(0)

          from effgen.models.cerebras_adapter import CerebrasAdapter
          from effgen.models.base import GenerationConfig

          # Affirmative tokens that signal the model agreed roses need water.
          # Several real Cerebras outputs include phrases like "Yes, roses need water"
          # or "They do." — we accept any of these as correct.
          AFFIRM = ("yes", "they do", "they need", "do need", "need water")

          def is_correct(text: str) -> bool:
              t = text.lower()
              return any(token in t for token in AFFIRM)

          passed = 0
          total = 0
          # Up to 2 attempts per model — Cerebras free tier sometimes returns empty
          # text on first call; a single retry is enough.
          for model_id in ["llama3.1-8b", "qwen-3-235b-a22b-instruct-2507"]:
              adapter = CerebrasAdapter(model_id, enable_rate_limiting=False)
              adapter.load()
              best_text = ""
              correct = False
              for attempt in range(2):
                  try:
                      result = adapter.generate(
                          "If all roses are flowers and all flowers need water, "
                          "do roses need water? Answer with just 'yes' or 'no' first, "
                          "then a one-sentence explanation.",
                          config=GenerationConfig(temperature=0.0, max_tokens=64),
                      )
                  except Exception as exc:
                      print(f"WARN: {model_id} attempt {attempt+1} raised: {exc}")
                      time.sleep(2)
                      continue
                  best_text = (result.text or "").strip()
                  if is_correct(best_text):
                      correct = True
                      break
                  time.sleep(2)
              adapter.unload()
              total += 1
              print(f"{'OK' if correct else 'FAIL'}: {model_id} -> {best_text!r}")
              if correct:
                  passed += 1

          if passed < 1:
              print(f"FAIL: {passed}/{total} reasoning checks passed (need at least 1)")
              sys.exit(1)
          print(f"OK: {passed}/{total} reasoning checks passed")
          PY
      - name: Open issue on reasoning failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Cerebras reasoning smoke failure (${new Date().toISOString().slice(0,10)})`,
              body: "Nightly reasoning smoke: both llama3.1-8b and qwen-3-235b failed a basic yes/no logic question. This may indicate a model API issue or effGen regression.",
              labels: ["bug", "cerebras", "automated"],
            });

  # ------------------------------------------------------------------ #
  # gpu-tests (self-hosted GPU runner, optional)                        #
  # ------------------------------------------------------------------ #
  # gpu-tests:
